name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        # v10.3.3; setup-uv publishes no floating v10 major tag, so @v10 is unresolvable
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install locked package and development dependencies
        run: uv sync --locked --extra dev --python ${{ matrix.python-version }}

      - name: Run canonical release gate
        run: uv run python scripts/release_check.py

      - name: Type-check the package against Python 3.10 stubs
        run: uv run mypy --python-version 3.10 blockference

      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore

  gnn-conformance:
    # Validates the committed GNN specification with the parser pinned in
    # specs/gnn-pin.json. The pinned revision is installed into a separate runtime
    # because the GNN distribution requires numpy>=2 while this package
    # resolves numpy 1.x; the validator verifies the installed parser file
    # digests against the pin record before parsing.
    name: gnn conformance (pinned v5.0.3)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        # v10.3.3; setup-uv publishes no floating v10 major tag, so @v10 is unresolvable
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install locked package and development dependencies
        run: uv sync --locked --extra dev --python 3.12

      - name: Provision the pinned GNN parser runtime
        run: |
          set -euo pipefail
          PIN=specs/gnn-pin.json
          PY=$(uv python find --no-project 3.12)
          REPO=$("$PY" -c "import json;print(json.load(open('$PIN'))['repository'])")
          COMMIT=$("$PY" -c "import json;print(json.load(open('$PIN'))['commit'])")
          uv venv --python 3.12 "$RUNNER_TEMP/gnn-runtime"
          # The install follows specs/gnn-pin.json; a pin bump re-points it.
          uv pip install --python "$RUNNER_TEMP/gnn-runtime/bin/python" \
            "generalized-notation-notation @ git+${REPO}@${COMMIT}"

      - name: Validate the GNN specification against the pinned parser
        run: >-
          uv run python scripts/validate_gnn_spec.py
          --gnn-runtime "$RUNNER_TEMP/gnn-runtime/bin/python" --json
