name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 120
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        # v10.3.3; setup-uv publishes no floating v10 major tag, so @v10 is unresolvable
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: "0.13.7"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install locked package and development dependencies
        run: uv sync --locked --extra dev --python ${{ matrix.python-version }}

      - name: Full test arm (coverage floor)
        run: uv run python scripts/release_check.py --arm test-full

      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore

  gnn-conformance:
    timeout-minutes: 120
    # Validates the committed GNN specification with the parser pinned in
    # specs/gnn-pin.json. The pinned revision is installed into a separate runtime
    # because the GNN distribution requires numpy>=2 while this package
    # resolves numpy 1.x. The project validator owns both guarded conformance
    # and shared importer checks. Independently reviewed immutable resources are
    # downloaded and SHA-256 checked before release execution; parser-file
    # digests alone are not complete source or installed-origin admission.
    name: gnn conformance (pinned)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        # v10.3.3; setup-uv publishes no floating v10 major tag, so @v10 is unresolvable
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: "0.13.7"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install locked package and development dependencies
        run: uv sync --locked --extra dev --python 3.12

      - name: Prepare reviewed GNN admission resources
        id: resources
        run: |
          set -euo pipefail
          # Resource delivery revision, not the parser revision in specs/gnn-pin.json.
          BASE="https://raw.githubusercontent.com/ActiveInferenceInstitute/Generalized_Notation_Notation/66d491f86895443cf588011cc6f40c37b8bae8fd/interop"
          RESOURCES="$RUNNER_TEMP/gnn-resources"
          mkdir -p "$RESOURCES"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            "$BASE/gnn_bootstrap.py" --output "$RESOURCES/gnn_bootstrap.py"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            "$BASE/v5.1.0-source-manifest.json" --output "$RESOURCES/v5.1.0-source-manifest.json"
          (
            cd "$RESOURCES"
            echo "f638d4c01fe7de31e43d793e59bf382d0c3d1a82f365c59238334a2b40adfb37  gnn_bootstrap.py" | sha256sum --check --strict
            echo "43b33c0b2b40386afa3f306fec4cc13bc1fd7c3b570fbf11d5008bad5c8e6b51  v5.1.0-source-manifest.json" | sha256sum --check --strict
          )
          echo "bootstrap=$RESOURCES/gnn_bootstrap.py" >> "$GITHUB_OUTPUT"
          echo "manifest=$RESOURCES/v5.1.0-source-manifest.json" >> "$GITHUB_OUTPUT"

      - name: Provision the pinned GNN parser runtime
        id: runtime
        run: |
          set -euo pipefail
          # Provisioning needs only the two install coordinates. The pin itself is
          # validated by the shared reader in the release arms below, so the
          # workflow keeps no pin reader of its own.
          REPO=$(uv run --no-sync python -c "import json; print(json.load(open('specs/gnn-pin.json', encoding='utf-8'))['repository'])")
          COMMIT=$(uv run --no-sync python -c "import json; print(json.load(open('specs/gnn-pin.json', encoding='utf-8'))['commit'])")
          uv venv --python 3.12 "$RUNNER_TEMP/gnn-runtime"
          # The install follows specs/gnn-pin.json; a pin bump re-points it.
          uv pip install --python "$RUNNER_TEMP/gnn-runtime/bin/python" \
            "generalized-notation-notation @ git+${REPO}@${COMMIT}"
          echo "python=$RUNNER_TEMP/gnn-runtime/bin/python" >> "$GITHUB_OUTPUT"

      - name: Release arms (including Python 3.12 full tests and GNN conformance)
        env:
          GNN_RUNTIME_PYTHON: ${{ steps.runtime.outputs.python }}
          GNN_BOOTSTRAP: ${{ steps.resources.outputs.bootstrap }}
          GNN_SOURCE_MANIFEST: ${{ steps.resources.outputs.manifest }}
        run: uv run python scripts/release_check.py --arm all
