name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 120
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        # v10.3.3; setup-uv publishes no floating v10 major tag, so @v10 is unresolvable
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: "0.13.7"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install locked package and development dependencies
        run: uv sync --locked --extra dev --python ${{ matrix.python-version }}

      - name: Full test arm (coverage floor)
        run: uv run python scripts/release_check.py --arm test-full

      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore

  gate:
    timeout-minutes: 60
    # Lint, types, docs, manuscript, smoke, and package work runs once; the
    # test matrix above repeats only the suite across supported Python versions.
    name: gate (lint, types, docs, manuscript, smoke, package)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        # v10.3.3; setup-uv publishes no floating v10 major tag, so @v10 is unresolvable
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: "0.13.7"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install locked package and development dependencies
        run: uv sync --locked --extra dev --python 3.12

      - name: Run the release arms
        run: >-
          uv run python scripts/release_check.py
          --arm lint --arm types --arm docs --arm manuscript
          --arm smoke --arm package

  gnn-conformance:
    timeout-minutes: 120
    # Validates the committed GNN specification with the parser pinned in
    # specs/gnn-pin.json. The pinned revision is installed into a separate runtime
    # because the GNN distribution requires numpy>=2 while this package
    # resolves numpy 1.x; the validator verifies the installed parser file
    # digests against the pin record before parsing.
    name: gnn conformance (pinned)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        # v10.3.3; setup-uv publishes no floating v10 major tag, so @v10 is unresolvable
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: "0.13.7"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install locked package without development extras
        run: uv sync --locked --python 3.12

      - name: Provision the pinned GNN parser runtime
        id: runtime
        run: |
          set -euo pipefail
          PIN=specs/gnn-pin.json
          PY=$(uv python find --no-project 3.12)
          REPO=$("$PY" -c "import json;print(json.load(open('$PIN'))['repository'])")
          COMMIT=$("$PY" -c "import json;print(json.load(open('$PIN'))['commit'])")
          uv venv --python 3.12 "$RUNNER_TEMP/gnn-runtime"
          # The install follows specs/gnn-pin.json; a pin bump re-points it.
          uv pip install --python "$RUNNER_TEMP/gnn-runtime/bin/python" \
            "generalized-notation-notation @ git+${REPO}@${COMMIT}"
          echo "python=$RUNNER_TEMP/gnn-runtime/bin/python" >> "$GITHUB_OUTPUT"

      - name: GNN conformance arm
        run: >-
          uv run python scripts/release_check.py
          --arm gnn --gnn-runtime "${{ steps.runtime.outputs.python }}"
          --require-gnn
