[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "active-blockference"
version = "1.0.0"
description = "Active Inference agents in cadCAD — discrete-state generative models for grid-world, multi-agent, and graph environments."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Active Inference Institute" },
]
keywords = [
    "active-inference",
    "free-energy-principle",
    "cadcad",
    "pomdp",
    "agent-based-modeling",
    "computational-neuroscience",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "cadCAD>=0.4.28",
    "radcad>=0.12",
    # radcad 0.14.0 requires numpy>=1.25,<2.2.7; numpy 2.x is unresolvable
    # while radcad is a required runtime dependency (verified 2026-11-01).
    "numpy>=1.25,<2.2.7",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "plotly>=5.0",
    "networkx>=3.0",
    "scikit-learn>=1.3",
    "pyyaml>=6.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-cov",
    "ruff",
    "nbclient",
    "nbformat",
    "ipykernel",
    "mypy>=1.10",
]
docs = [
    "mkdocs",
    "mkdocs-material",
]
pymdp = [
    "inferactively-pymdp>=1.0.1",
]
research = [
    "openai>=1.0",
]

[project.scripts]
blockference = "blockference.cli:main"
grts = "GRTs.cli:main"

[project.urls]
Homepage = "https://github.com/ActiveInferenceInstitute/ActiveBlockference"
Issues = "https://github.com/ActiveInferenceInstitute/ActiveBlockference/issues"
Institute = "https://activeinference.org/"

[tool.setuptools.packages.find]
include = ["blockference*", "GRTs*"]
exclude = ["tests*", "notebooks*", "docs*"]

[tool.setuptools.package-data]
blockference = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "gnn: requires the pinned GNN parser runtime (GNN_ROOT or GNN_RUNTIME_PYTHON)",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["notebooks", "GRTs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
disable_error_code = ["import-untyped"]
check_untyped_defs = true

[tool.uv]
constraint-dependencies = ["pillow>=13.0.0", "tornado>=6.6"]
