repo:
  name: ActiveBlockference
  slug: activeblockference
  full_name: ActiveInferenceInstitute/ActiveBlockference
  description: ActiveBlockference is a CPU-oriented Active Inference library for deterministic,
    discrete-state radCAD and cadCAD grid simulations. It provides strict YAML/TOML
    configuration, canonical (y, x) dynamics, persisted diagnostics, rendered artefacts,
    and fail-closed validation.
